name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install optional deck dependency
        run: python -m pip install -r skills/management-slides/requirements.txt
      - name: Validate catalog and publication guardrails
        run: python scripts/validate_repo.py
      - name: Test repository structure
        run: python -m unittest discover -s tests -v
      - name: Test editable deck layouts
        run: python skills/management-slides/scripts/test_layouts.py
